name: Flutter Build & Delivery

on:
  push:
    branches: ["arena/9027d464-nova-craft", "main"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.35.7"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" > /dev/null
          fi

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Static analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(tail -c 55000 /tmp/analyze.log || true)" || true
            exit "$STATUS"
          fi

      - name: Unit and widget tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(tail -c 55000 /tmp/test.log || true)" || true
            exit "$STATUS"
          fi

      - name: Build APK
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS || 'nova-craft' }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD || secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.p12
        run: |
          set -euo pipefail
          exec > >(tee /tmp/build-step.log) 2>&1
          mkdir -p delivery
          if [ -n "${NOVA_KEYSTORE_BASE64:-}" ] && [ -n "${NOVA_KEYSTORE_PASSWORD:-}" ]; then
            printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$NOVA_KEYSTORE_PATH"
            flutter build apk --release --android-skip-build-dependency-validation --no-shrink 2>&1 | tee /tmp/build.log
            cp build/app/outputs/flutter-apk/app-release.apk delivery/NOVA-CRAFT-1.0.0-release.apk
            SIGNING_STORE="$NOVA_KEYSTORE_PATH"
            SIGNING_STORE_TYPE="PKCS12"
            SIGNING_STORE_PASSWORD="$NOVA_KEYSTORE_PASSWORD"
            SIGNING_KEY_ALIAS="$NOVA_KEY_ALIAS"
            SIGNING_KEY_PASSWORD="$NOVA_KEY_PASSWORD"
            BUILD_KIND="release"
          else
            echo "Release keystore secrets are unavailable in this repository."
            echo "The APKs will be non-production debug-signed builds; no production release key is configured."
            flutter build apk --release --android-skip-build-dependency-validation --no-shrink 2>&1 | tee /tmp/build.log
            cp build/app/outputs/flutter-apk/app-release.apk delivery/NOVA-CRAFT-1.0.0-release-debugsigned.apk
            flutter build apk --release --android-skip-build-dependency-validation --no-shrink --split-per-abi 2>&1 | tee -a /tmp/build.log
            if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
              cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk delivery/NOVA-CRAFT-1.0.0-arm64-debugsigned.apk
            fi
            echo "Creating an ephemeral CI debug keystore for this non-production debug-signed APK."
            SIGNING_STORE="$RUNNER_TEMP/nova-debug.keystore"
            SIGNING_STORE_TYPE="JKS"
            keytool -genkeypair -v \
              -keystore "$SIGNING_STORE" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
            SIGNING_STORE_PASSWORD="android"
            SIGNING_KEY_ALIAS="androiddebugkey"
            SIGNING_KEY_PASSWORD="android"
            BUILD_KIND="release (debug-signed)"
          fi

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          export NOVA_APK_KS_PASS="$SIGNING_STORE_PASSWORD"
          export NOVA_APK_KEY_PASS="$SIGNING_KEY_PASSWORD"
          for APK in delivery/*.apk; do
            ALIGNED="${APK%.apk}.aligned.apk"
            SIGNED="${APK%.apk}.signed.apk"
            "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
            # The manifest remains minSdk 26; lower this signing floor only so
            # apksigner emits the legacy JAR/v1 signature as well as v2/v3.
            "$APKSIGNER" sign \
              --ks "$SIGNING_STORE" \
              --ks-type "$SIGNING_STORE_TYPE" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:NOVA_APK_KS_PASS \
              --key-pass env:NOVA_APK_KEY_PASS \
              --min-sdk-version 1 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED" "$ALIGNED"
            mv "$SIGNED" "$APK"
            rm -f "$ALIGNED"
            if [[ "$APK" == *arm64* ]]; then
              cp "$APK" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            else
              cp "$APK" build/app/outputs/flutter-apk/app-release.apk
            fi
          done
          unset NOVA_APK_KS_PASS NOVA_APK_KEY_PASS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD
          echo "BUILD_KIND=$BUILD_KIND" >> "$GITHUB_ENV"

      - name: Verify APK package, signature and checksum
        run: |
          set -euo pipefail
          exec > >(tee /tmp/verify-step.log) 2>&1
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          : > delivery/package-info.txt
          : > delivery/signature-verification.txt
          for APK in delivery/*.apk; do
            echo "== $APK" | tee -a delivery/package-info.txt
            "$AAPT" dump badging "$APK" | head -6 | tee -a delivery/package-info.txt
            grep -q "package: name='io.github.abiedadam0077.novacraft'" delivery/package-info.txt
            grep -q "versionName='1.0.0'" delivery/package-info.txt
            echo "== $APK" | tee -a delivery/signature-verification.txt
            VERIFY_REPORT=$(mktemp)
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$VERIFY_REPORT" | tee -a delivery/signature-verification.txt
            grep -Fq 'Verified using v1 scheme (JAR signing): true' "$VERIFY_REPORT"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$VERIFY_REPORT"
            "$ZIPALIGN" -c -v 4 "$APK" | tee -a delivery/signature-verification.txt
            rm -f "$VERIFY_REPORT"
          done
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          du -h delivery/*.apk

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-flutter-${{ github.run_id }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="flutter-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -d '' FILES < <(find delivery -maxdepth 1 -type f -size +0c -print0)
          SUMMARY="delivery/TEST-REPORT.md"
          {
            echo "# NOVA CRAFT ${BUILD_KIND} build"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Flutter: ${FLUTTER_VERSION}"
            echo "- Package: io.github.abiedadam0077.novacraft"
            echo "- Tests: \`flutter analyze\` + \`flutter test\` passed before this build."
            echo "- Artifact: $(basename "$(find delivery -name '*.apk' | head -1)")"
            echo
            echo '```'
            cat delivery/package-info.txt
            echo '```'
          } > "$SUMMARY"
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NOVA CRAFT 1.0.0 (${BUILD_KIND} APK)" \
            --notes-file "$SUMMARY"
          ASSET=$(basename "$(find delivery -name '*arm64*.apk' | head -1)")
          if [ -z "$ASSET" ]; then ASSET=$(basename "$(find delivery -name '*.apk' | head -1)"); fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "Download: $URL" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/download-check"
          gh release download "$TAG" --pattern '*.apk' --dir "$RUNNER_TEMP/download-check"
          (cd "$RUNNER_TEMP/download-check" && sha256sum -c "$GITHUB_WORKSPACE/delivery/SHA256SUMS.txt")
          echo "$URL" > delivery/DOWNLOAD-LINK.txt

      - name: Diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build failed. Inspect the build/signing step logs above." >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/verify-step.log ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(tail -c 55000 /tmp/verify-step.log || true)" || true
          elif [ -s /tmp/build-step.log ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(tail -c 55000 /tmp/build-step.log || true)" || true
          elif [ -s /tmp/build.log ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(tail -c 55000 /tmp/build.log || true)" || true
          fi
