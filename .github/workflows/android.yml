name: Android Build

on:
  push:
    branches: ["arena/8d2bcdd2-nova-craft", "main"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build signed release APK"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Decode release keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::NOVA_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.p12"
      - name: Assemble signed release
        if: ${{ inputs.release }}
        env:
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.p12
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Verify release signature
        if: ${{ inputs.release }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
