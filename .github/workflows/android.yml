name: Android Build

on:
  push:
    branches: ["arena/8d2bcdd2-nova-craft", "main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build signed release APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: set -o pipefail; gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
      - name: Assemble debug
        run: set -o pipefail; gradle assembleDebug --stacktrace 2>&1 | tee -a /tmp/build.log
      - name: Publish failure log as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 220 /tmp/build.log > /tmp/fail.txt || true
          python3 .github/scripts/post_failure.py || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Decode release keystore
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::NOVA_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.p12"
      - name: Assemble signed release
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        env:
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.p12
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: nova-craft
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Verify release signature
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release with APK
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" > /dev/null 2>&1; then TAG="v1.0.0-run${{ github.run_number }}"; fi
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "NOVA CRAFT $TAG" --notes "NOVA CRAFT Android release (signed). Package: io.github.abiedadam0077.novacraft"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Upload release APK
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
