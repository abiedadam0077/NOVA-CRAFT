name: Android Build

on:
  push:
    branches: ["arena/484b1c20-nova-craft", "main"]
    paths-ignore: ["README.md", "docs/**", ".github/workflows/publish-tested-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests, lint, debug APK and instrumentation APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee /tmp/build.log
      - name: Select installable APK (original release key if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS || 'nova-craft' }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD || secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.p12
        run: |
          set -euo pipefail
          mkdir -p delivery
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$NOVA_KEYSTORE_PASSWORD" ]; then
            trap 'rm -f "$NOVA_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NOVA_KEYSTORE_PATH"
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk delivery/NOVA-CRAFT-1.0.0-release.apk
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "Original release signing secrets are unavailable. Delivering explicitly labelled debug APK; no new release key generated."
            cp app/build/outputs/apk/debug/app-debug.apk delivery/NOVA-CRAFT-1.0.0-debug.apk
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
          fi
      - name: Verify actual APK signature and package
        run: |
          set -euo pipefail
          APK=$(find delivery -name '*.apk')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee delivery/signature-verification.txt
          "$AAPT" dump badging "$APK" > delivery/package-info.txt
          grep -q "package: name='io.github.abiedadam0077.novacraft'" delivery/package-info.txt
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 installation and UI/native/keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            bash .github/scripts/check-installed-apk.sh
      - name: Upload test reports and verified APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-craft-delivery-${{ github.run_id }}
          path: |
            delivery/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK only after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/publication.log) 2>&1
          python3 .github/scripts/delivery-report.py
          TAG="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -d '' FILES < <(find delivery -maxdepth 1 -type f -size +0c -print0)
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --prerelease --title "NOVA CRAFT 1.0.0 ($BUILD_KIND, tested APK)" --notes-file delivery/TEST-REPORT.md
          # Verify the published binary can actually be downloaded and matches the tested APK.
          mkdir -p "$RUNNER_TEMP/download-check"
          gh release download "$TAG" --pattern '*.apk' --dir "$RUNNER_TEMP/download-check"
          (cd "$RUNNER_TEMP/download-check" && sha256sum -c "$GITHUB_WORKSPACE/delivery/SHA256SUMS.txt")
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          cat delivery/TEST-REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { tail -n 120 /tmp/build.log; tail -n 100 /tmp/publication.log; find app/build/outputs/androidTest-results -name '*.xml'; } > /tmp/fail.txt 2>&1 || true
          python3 .github/scripts/post_failure.py || true
