name: Test Playit API
on: [push]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: curl -sL https://raw.githubusercontent.com/playit-cloud/playit-agent/master/packages/agent_cli/src/main.rs > playit_response.txt || true
      - name: Commit responses
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add playit_response.txt || true
          git commit -m "Playit response" || true
          git push origin ${{ github.ref }} || true
