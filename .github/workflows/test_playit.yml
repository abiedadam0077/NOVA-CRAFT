name: Test Playit API
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 test_playit.py > playit_response.txt
      - name: Commit responses
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add playit_response.txt
          git commit -m "Playit response" || true
          git push
