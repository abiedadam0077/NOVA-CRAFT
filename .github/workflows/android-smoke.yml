name: Android launch smoke test

# Downloads an already-published APK, verifies its signature with the Android
# build tools, installs it on a fresh emulator and records whether the process
# survives the splash screen. Every result is posted as a commit comment so it
# can be audited from outside the runner.

on:
  push:
    paths:
      - ".github/workflows/android-smoke.yml"
      - "smoke-trigger.txt"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains the APK to test
        required: true
        default: flutter-apk-39058403987-1
      apk_glob:
        description: Glob used to pick one APK from the release
        required: true
        default: "*arm64*.apk"

permissions:
  contents: write

env:
  PACKAGE: io.github.abiedadam0077.novacraft
  TAG: ${{ inputs.tag || 'flutter-apk-39058403987-1' }}
  APK_GLOB: ${{ inputs.apk_glob || '*arm64*.apk' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the exact published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p smoke/apks
          set +e
          gh release download "$TAG" --pattern '*.apk' --dir smoke/apks > smoke/download.txt 2>&1
          CODE=$?
          set -e
          echo "tag=$TAG download_exit=$CODE" >> smoke/download.txt
          cat smoke/download.txt
          ls -l smoke/apks || true
          if [ "$CODE" -ne 0 ]; then exit "$CODE"; fi
          APK=$(find smoke/apks -name "$APK_GLOB" | head -1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify signature, alignment and structure
        run: |
          set -uo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          JARSIGNER=$(command -v jarsigner || true)
          {
            echo "## APK under test"
            echo '```'
            ls -l "$APK"
            sha256sum "$APK"
            echo '```'
            echo "## apksigner verify"
            echo '```'
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1
            echo "exit=$?"
            echo '```'
            echo "## jarsigner (v1 / JAR signature)"
            echo '```'
            if [ -n "$JARSIGNER" ]; then "$JARSIGNER" -verify -certs "$APK" 2>&1 | head -30; else echo "jarsigner not found"; fi
            echo '```'
            echo "## aapt badging"
            echo '```'
            "$AAPT" dump badging "$APK" 2>&1 | head -12
            echo '```'
            echo "## native libraries and 16 KB alignment"
            echo '```'
            unzip -l "$APK" | grep -E 'lib/|resources.arsc|AndroidManifest' || true
            "$ZIPALIGN" -c -v -P 16 4 "$APK" 2>&1 | tail -12 || true
            echo '-- 4 KB check --'
            "$ZIPALIGN" -c -v 4 "$APK" 2>&1 | tail -6 || true
            echo '```'
          } > smoke/report.txt 2>&1
          cat smoke/report.txt

      - name: KVM availability
        run: |
          {
            echo "## KVM / host"
            echo '```'
            ls -l /dev/kvm 2>&1 || true
            echo "vmx/svm flags: $(grep -c -E 'vmx|svm' /proc/cpuinfo || true)"
            free -m || true
            echo '```'
          } | tee smoke/kvm.txt

      - name: Install and launch on emulator
        timeout-minutes: 25
        run: |
          set -uo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo "## Emulator setup" > smoke/emulator.txt
          sudo apt-get update -qq >> smoke/emulator.txt 2>&1 || true
          sudo apt-get install -y -qq libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libglu1-mesa >> smoke/emulator.txt 2>&1 || true
          yes | "$SDKMANAGER" --licenses >> smoke/emulator.txt 2>&1 || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-30;default;x86_64" >> smoke/emulator.txt 2>&1 || true
          echo no | "$AVDMANAGER" create avd -n nova30 -k "system-images;android-30;default;x86_64" -d pixel_2 --force >> smoke/emulator.txt 2>&1 || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd nova30 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on -verbose > smoke/emulator.log 2>&1 &
          echo "emulator_pid=$!" >> smoke/emulator.txt
          adb start-server >> smoke/emulator.txt 2>&1 || true
          adb wait-for-device >> smoke/emulator.txt 2>&1 || true
          BOOTED=0
          for i in $(seq 1 120); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; break; fi
            sleep 3
          done
          echo "booted=$BOOTED" >> smoke/emulator.txt
          echo "abi: $(adb shell getprop ro.product.cpu.abilist 2>/dev/null | tr -d '\r')" > smoke/device.txt
          if [ "$BOOTED" != "1" ]; then
            echo "emulator did not boot" >> smoke/device.txt
            exit 1
          fi
          adb logcat -c
          adb install -r "$APK" > smoke/install.txt 2>&1
          echo "install_exit=$?" >> smoke/install.txt
          adb shell am start -W -n "$PACKAGE/.MainActivity" > smoke/start.txt 2>&1
          echo "start_exit=$?" >> smoke/start.txt
          sleep 20
          adb shell pidof "$PACKAGE" > smoke/pid.txt 2>&1 || true
          adb shell dumpsys activity activities > smoke/activities.txt 2>&1 || true
          adb shell dumpsys package "$PACKAGE" > smoke/package.txt 2>&1 || true
          adb exec-out screencap -p > smoke/screen.png 2>/dev/null || true
          adb logcat -d -v threadtime > smoke/logcat-full.txt 2>&1 || true
          grep -E "AndroidRuntime|FATAL|libflutter|flutter|Nova|novacraft|Impeller|signal|crash" smoke/logcat-full.txt | tail -400 > smoke/logcat.txt || true
          cat smoke/install.txt smoke/start.txt smoke/pid.txt smoke/device.txt

      - name: Build the evidence report
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Android launch smoke test"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK: \`${APK:-missing}\`"
            cat smoke/kvm.txt 2>/dev/null || true
            echo "- Download:"
            echo '```'
            cat smoke/download.txt 2>/dev/null || echo 'not run'
            echo '```'
            echo "- Device:"
            echo '```'
            cat smoke/device.txt 2>/dev/null || echo 'no device data'
            echo '```'
            echo "- Emulator setup:"
            echo '```'
            tail -30 smoke/emulator.txt 2>/dev/null || echo 'not run'
            echo '```'
            echo "- Emulator log (tail):"
            echo '```'
            tail -40 smoke/emulator.log 2>/dev/null || echo 'no emulator log'
            echo '```'
            echo "- Install:"
            echo '```'
            cat smoke/install.txt 2>/dev/null || echo 'not run'
            echo '```'
            echo "- am start -W:"
            echo '```'
            cat smoke/start.txt 2>/dev/null || echo 'not run'
            echo '```'
            echo "- PID after 15 s:"
            echo '```'
            cat smoke/pid.txt 2>/dev/null || echo 'none'
            echo '```'
            echo "- Resumed activity / package facts:"
            echo '```'
            grep -E "mResumedActivity|topResumedActivity|versionName|primaryCpuAbi|signatures" smoke/activities.txt smoke/package.txt 2>/dev/null | head -20 || echo 'none'
            echo '```'
            echo
            cat smoke/report.txt 2>/dev/null || true
            echo
            echo "## Filtered logcat"
            echo '```'
            tail -250 smoke/logcat.txt 2>/dev/null || echo 'no logcat'
            echo '```'
          } > smoke/summary.md
          wc -c smoke/summary.md

      - name: Post evidence as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(head -c 55000 smoke/summary.md)" || true

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 30
