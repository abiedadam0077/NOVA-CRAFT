name: Analyze
on: [push]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze > analyze_output.txt || true
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add analyze_output.txt || true
          git commit -m "Analyze output" || true
          git push origin ${{ github.ref }} || true
