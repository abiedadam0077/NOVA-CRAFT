name: Publish already tested APK

on:
  push:
    branches: ["arena/484b1c20-nova-craft"]
    paths: [".github/workflows/publish-tested-apk.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_RUN: "38998610684"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify provenance and successful tests of existing artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > /tmp/source-jobs.json
          python3 - <<'PY'
          import json
          import os
          run = json.load(open('/tmp/source-run.json'))
          assert run['head_branch'] == 'arena/484b1c20-nova-craft'
          required = {
              'Unit tests, lint, debug APK and instrumentation APK',
              'Select installable APK (original release key if available)',
              'Verify actual APK signature and package',
              'Android 35 installation and UI/native/keystore tests',
              'Upload test reports and verified APK',
          }
          steps = json.load(open('/tmp/source-jobs.json'))['jobs'][0]['steps']
          passed = {s['name'] for s in steps if s['conclusion'] == 'success'}
          assert required <= passed, required - passed
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SOURCE_SHA=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: nova-craft-delivery-38998610684
          run-id: "38998610684"
          github-token: ${{ github.token }}
          path: recovered
      - name: Verify recovered APK and test evidence
        run: |
          set -euo pipefail
          cd recovered
          (cd delivery && sha256sum -c SHA256SUMS.txt)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs delivery/*.apk
          grep -q Success delivery/install-result.txt
          grep -q 'Status: ok' delivery/launch-result.txt
          grep -q 'NOVA CRAFT' delivery/launch-ui.xml
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = list(Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          assert results, 'Missing device test results'
          tests = 0
          for file in results:
              suite = ET.parse(file).getroot()
              assert int(suite.get('failures', '0')) == 0
              assert int(suite.get('errors', '0')) == 0
              tests += int(suite.get('tests', '0')) - int(suite.get('skipped', '0'))
          assert tests >= 3, 'Expected UI, keystore and native encryption tests'
          # Retain machine-readable device test results next to the APK.
          for index, file in enumerate(results):
              Path(f'delivery/device-tests-{index}.xml').write_bytes(file.read_bytes())
          note = f'''# NOVA CRAFT 1.0.0 — tested installable preview

          **Debug APK, not an original-key signed release.** The original release signing secret is unavailable. No replacement release key was generated. Android's standard debug signing was verified with apksigner.

          - Source: `{os.environ['SOURCE_SHA']}`
          - Build and test run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN']}
          - Unit tests and Android lint: successful CI step, verified via GitHub API.
          - Android 35 x86_64 emulator: {tests} instrumentation tests passed (onboarding/authentication screen, activity recreation, Android Keystore, packaged native encryption).
          - The attached APK was installed and launched successfully; welcome UI rendered and process remained alive without an app crash.
          - Recovered binary checksum and signature verified again before publication.
          - Android 8.0+ (API 26). No manual signing-key handling required.

          Real-phone/ARM behavior, authenticated GitHub server creation, Minecraft/Playit connectivity and full backup cycles are not yet verified end to end. This is not a claim that all product requirements are complete.

          Download the .apk asset directly. If an older installation uses a different signature, Android may require uninstalling it first (removes local app settings).
          '''
          Path('delivery/TEST-REPORT.md').write_text('\n'.join(line.lstrip() for line in note.splitlines()) + '\n')
          PY
      - name: Publish nonempty assets and verify direct download
        run: |
          set -euo pipefail
          exec > >(tee /tmp/publication.log) 2>&1
          TAG="tested-apk-$SOURCE_RUN"
          cd recovered/delivery
          mapfile -d '' FILES < <(find . -maxdepth 1 -type f -size +0c -print0)
          gh release create "$TAG" "${FILES[@]}" --target "$SOURCE_SHA" --prerelease --title "NOVA CRAFT 1.0.0 — tested Android APK (debug)" --notes-file TEST-REPORT.md
          mkdir -p "$RUNNER_TEMP/download-check"
          gh release download "$TAG" --pattern '*.apk' --dir "$RUNNER_TEMP/download-check"
          (cd "$RUNNER_TEMP/download-check" && sha256sum -c "$GITHUB_WORKSPACE/recovered/delivery/SHA256SUMS.txt")
          gh release view "$TAG" --json url,assets > /tmp/published.json
          cat /tmp/published.json
          cat /tmp/published.json >> "$GITHUB_STEP_SUMMARY"
      - name: Report publication failure
        if: failure()
        run: |
          tail -n 100 /tmp/publication.log > /tmp/fail.txt 2>&1 || true
          python3 .github/scripts/post_failure.py || true
