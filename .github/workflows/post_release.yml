name: Post Release
on: [push]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Commit APK
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          cp build/app/outputs/flutter-apk/app-release.apk nova-craft-final.apk || (find build -name "*.apk" && exit 1)
          sha256sum nova-craft-final.apk > final_sha256.txt
          git pull --rebase origin ${{ github.ref }} || true
          git add nova-craft-final.apk final_sha256.txt
          git commit -m "Add final apk" || true
          git push origin ${{ github.ref }} || true
