name: Post Release
on: [push]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: show sha256sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download flutter-apk-39085129294-1 --pattern "SHA256SUMS.txt" || true
          cat SHA256SUMS.txt || true
