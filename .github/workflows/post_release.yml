name: Post Release
on: [push]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release > build_log.txt 2>&1 || true
      - name: Commit Log
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add build_log.txt
          git commit -m "Build log" || true
          git push origin ${{ github.ref }} || true
